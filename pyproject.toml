[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litefs"
dynamic = ["version"]
description = "Build a web server framework using Python."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Leafcoder", email = "leafcoder@gmail.com"}
]
keywords = ["web", "server", "wsgi", "http", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: CGI Tools/Libraries",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "argh>=0.26.2",
    "greenlet>=0.4.13",
    "Mako>=1.0.6",
    "MarkupSafe>=1.1.1",
    "pathtools>=0.1.2",
    "PyYAML>=5.1",
    "watchdog>=0.8.3",
    "SQLAlchemy>=2.0.0",
]

[project.optional-dependencies]
wsgi = [
    "gunicorn>=20.1.0",
    "uwsgi>=2.0.20",
    "waitress>=2.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=9.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "myst-parser>=3.0.0",
    "sphinx-autodoc-typehints>=3.0.0",
]
performance = [
    "memory-profiler>=0.60.0",
    "line-profiler>=3.5.0",
    "locust>=2.15.0",
    "pytest-benchmark>=4.0.0",
    "psutil>=5.9.0",
    "py-spy>=0.3.14",
    "pytest-xdist>=3.0.0",
]

[project.scripts]
litefs = "litefs.cli:main"

[project.urls]
Homepage = "https://github.com/leafcoder/litefs"
Documentation = "https://github.com/leafcoder/litefs#readme"
Repository = "https://github.com/leafcoder/litefs"
Issues = "https://github.com/leafcoder/litefs/issues"

[tool.setuptools]
package-dir = {"" = "src"}
package-data = {litefs = ["templates/*.j2", "templates/*.py", "templates/*/*.j2", "templates/*/*.py", "templates/*/*/*.j2", "templates/*/*/*.py"]}

[tool.setuptools.dynamic]
version = {attr = "litefs._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
# line-length 与 [tool.black] / .flake8 保持一致
# target-version 省略，自动从 requires-python = ">=3.8" 推断
line-length = 100
extend-exclude = ["docs", "build", "dist"]

[tool.ruff.lint]
# 默认规则集（E4/E7/E9/F），与 flake8 常用规则对齐，后续按目录逐步扩展
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# 分阶段类型化治理：以下模块尚未完成类型注解收敛，暂不阻断 CI。
# 收敛一个模块即可从本列表移除，使 mypy 门禁范围逐步扩大。
[[tool.mypy.overrides]]
module = [
    "litefs.auth",
    "litefs.auth.decorators",
    "litefs.auth.jwt",
    "litefs.auth.middleware",
    "litefs.auth.models",
    "litefs.auth.oauth2",
    "litefs.auth.password",
    "litefs.auth.providers",
    "litefs.cache.cache",
    "litefs.cache.db",
    "litefs.cache.manager",
    "litefs.cache.redis",
    "litefs.cache_decorators",
    "litefs.cache.form_cache",
    "litefs.cli",
    "litefs.config",
    "litefs.database.core",
    "litefs.debug",
    "litefs.debug.middleware",
    "litefs.forms",
    "litefs.handlers.asgi",
    "litefs.handlers.enhanced",
    "litefs.handlers.form",
    "litefs.handlers.socket",
    "litefs.handlers.wsgi",
    "litefs.middleware.csrf",
    "litefs.middleware.enhanced_logging",
    "litefs.middleware.rate_limit",
    "litefs.openapi",
    "litefs.openapi.generator",
    "litefs.openapi.ui",
    "litefs.plugins.base",
    "litefs.plugins.loader",
    "litefs.routing.radix_tree",
    "litefs.routing.router",
    "litefs.server.asgi",
    "litefs.server.asyncio",
    "litefs.server.greenlet",
    "litefs.session.cache_session",
    "litefs.session.db",
    "litefs.session.manager",
    "litefs.session.redis",
    "litefs.session.session",
    "litefs.static_handler",
    "litefs.tasks",
    "litefs.validators",
    "litefs.websocket.connection",
    "litefs.websocket.protocol",
    "litefs.websocket.server",
]
ignore_errors = true

# 第三方库缺少类型存根（py.typed）或未安装，不属于本项目类型化范围
[[tool.mypy.overrides]]
module = [
    "mako.*",
    "memcache.*",
    "pymemcache.*",
    "watchdog.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "ignore:session_secure 设置为 False:UserWarning",
    "ignore:生产环境检测到 session_secure=False:UserWarning",
    "ignore:生产环境检测到 debug=True:UserWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
